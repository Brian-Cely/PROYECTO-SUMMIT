<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summit Paquetes - Registro</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-body">
    <div class="auth-card">
        <p class="auth-links"><a href="index.html">← Volver al inicio</a></p>
        <div class="logo auth-logo">
            <img src="images/logoSUMMIT.PNG" alt="Logo SUMMIT" class="header-logo-img">
            <div class="logo-text">
                <span class="logo-title">SUMMIT</span>
                <span class="logo-subtitle">PAQUETES</span>
            </div>
        </div>
    <fieldset class="registerFieldset"><legend>Creacion Cuenta</legend>
        <form id="registerForm" novalidate>
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" placeholder="Nombre" required>
                <span class="error-msg" id="errorNombre"></span>
            </div>
            <br>
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@gmail.com" required>
                <span class="error-msg" id="errorEmail"></span>
            </div>
            <br>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
                <span class="error-msg" id="errorPassword"></span>
            </div>
            <br>
            <div class="form-group">
                <label for="userRole">Tipo de usuario</label>
                <select id="userRole" required>
                    <option value="">Seleccione un rol</option>
                    <option value="cliente">Cliente / Turista</option>
                    <option value="administrador">Administrador</option>
                </select>
                <span class="error-msg" id="errorUserRole"></span>
            </div>
                <br>
                <button type="submit" class="btn3 btn-primary btn-full">Registrarse</button>
        </form>
    </fieldset>
    <p class="auth-text">¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
    </div>

    <script src="js/register-validation.js"></script>
</body>
</html>
