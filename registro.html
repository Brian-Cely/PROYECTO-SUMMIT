<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summit Paquetes - Registro</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-body">
    <div class="auth-card">
        <h2>SUMMIT</h2>
    <fieldset class="registerFieldset"><legend>Creacion Cuenta</legend>
        <form novalidate>
            <div class="form-group" >
                <label for="name">Nombre</label>
                <input type="text" placeholder="Nombre" required>
                <span class="error-esg" id="errorNombre"></span>
            </div>
            <br>
            <div class="form-group">
                <label for="email" >Correo Electrónico</label>
                <input type="email" placeholder="ejemplo@gmail.com" required>
                <span class="error-msg" id="errorEmail"></span>
            </div>
            <br>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" placeholder="••••••••" required>
                <span class="error-msg" id="errorPassword"></span>
            </div>
                <br>
                <button type="submit" class="btn btn-primary btn-full" >Registrarse</button>
        </form>
    </fieldset>
    <p class="auth-text">¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
    </div>

    <script src="js/register-validation.js"></script>
</body>
</html>
